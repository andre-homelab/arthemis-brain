basePath: /
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.Project:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      justification:
        type: string
      lifetimeEnd:
        type: string
      lifetimeStart:
        type: string
      name:
        type: string
      proponentID:
        type: integer
      updatedAt:
        type: string
    type: object
  models.Proponent:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      id:
        type: integer
      name:
        description: ID    string `gorm:"type:uuid;default:gen_random_uuid();primaryKey"
          json:"id"`
        type: string
      project:
        $ref: '#/definitions/models.Project'
      updatedAt:
        type: string
    type: object
  utils.ErrorResponse:
    properties:
      error:
        example: Tarefa não encontrada
        type: string
      message:
        example: ID inválido fornecido
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: API service for Arthemis Brain.
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Arthemis Brain API
  version: "1.0"
paths:
  /health:
    get:
      description: Evaluates the status of the server and database
      produces:
      - application/json
      responses:
        "200":
          description: Successful response containing status, db connection, and timestamp
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - health
  /project/{id}:
    delete:
      description: Deletes a project by ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project deleted successfully
          schema:
            type: boolean
        "400":
          description: ID not informed
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Delete project
      tags:
      - project
    get:
      description: Retrieves a project by ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Project'
        "400":
          description: ProjectID not received
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get project
      tags:
      - project
    post:
      consumes:
      - application/json
      description: Creates a new project associated with a proponent ID
      parameters:
      - description: Proponent ID
        in: path
        name: id
        required: true
        type: string
      - description: Project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/models.Project'
      produces:
      - application/json
      responses:
        "202":
          description: Project created successfully
          schema:
            type: boolean
        "400":
          description: Invalid JSON or bad request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: 'Unauthorized: proponent_id context missing'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Proponent already has a project
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Create project
      tags:
      - project
    put:
      consumes:
      - application/json
      description: Updates an existing project by ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Project details to update
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/models.Project'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Project'
        "400":
          description: Invalid JSON or ProjectID not received
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Update project
      tags:
      - project
  /proponent/{id}:
    delete:
      description: Deletes a proponent by ID
      parameters:
      - description: Proponent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Proponent deleted successfully
          schema:
            type: boolean
        "400":
          description: ProponentID not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Proponent not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Delete Proponent
      tags:
      - proponent
    get:
      description: Retrieves a proponent by ID
      parameters:
      - description: Proponent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Proponent'
        "400":
          description: ProponentID not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Proponent not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get Proponent
      tags:
      - proponent
    patch:
      consumes:
      - application/json
      description: Updates an existing proponent by ID
      parameters:
      - description: Proponent ID
        in: path
        name: id
        required: true
        type: string
      - description: Proponent details to update
        in: body
        name: proponent
        required: true
        schema:
          $ref: '#/definitions/models.Proponent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Proponent'
        "400":
          description: Invalid JSON or ProponentID not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Proponent not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Update Proponent
      tags:
      - proponent
    post:
      consumes:
      - application/json
      description: Creates a new proponent
      parameters:
      - description: Proponent ID
        in: path
        name: id
        required: true
        type: string
      - description: Proponent details
        in: body
        name: proponent
        required: true
        schema:
          $ref: '#/definitions/models.Proponent'
      produces:
      - application/json
      responses:
        "202":
          description: Proponent created successfully
          schema:
            type: boolean
        "400":
          description: Invalid JSON or bad request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Create Proponent
      tags:
      - proponent
swagger: "2.0"
